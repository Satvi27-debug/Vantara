version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vantara
      POSTGRES_PASSWORD: vantara
      POSTGRES_DB: vantara_cbp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://vantara:vantara@db:5432/vantara_cbp
    ports:
      - "8000:8000"
    depends_on:
      - db

  dashboard:
    build: .
    command: streamlit run frontend/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
